function tags(){return data.genres.map(x=>`<button type="button" class="tag" data-action="genre" data-target="${esc(x)}">${esc(x)}</button>`).join('')||'<span class="note">No favorite genres yet.</span>';}

function overview(){

const bio=panel('<span class="ico">♧</span> About Me',`<p class="panel-copy">${esc(data.bio)}</p>`,['edit','bio'],'about-preview');
const genres=panel('<span class="ico">♫</span> Favorite Music &amp; Eras',`<div class="tags">${tags()}</div>`,['edit','genres']);
const stat=panel('<span class="ico">▥</span> My Activity',`<div class="stat-grid">${[['♩',data.songs.length,'My Songs'],['♡',2,'Favorites'],['☆',4,'Reviews'],['▣',12,'Photos']].map(([ico,nm,name])=>`<button class="stat" data-action="stat" data-target="${esc(name)}"><span class="stat-head"><span class="ico">${ico}</span> ${nm}</span><span class="stat-sub">${name}</span></button>`).join('')}</div>`,null,'stat-panel');

}

const b=panel('<span class="ico">♙</span> My Story',`<p class="panel-copy">${esc(data.bio)}</p>`,['edit','bio']);
const c=panel('<span class="ico">♫</span> My Karaoke Interests',`<div class="role-set">${roles.filter(r=>data.roles.includes(r[0])).map(r=>`<span class="role-pill" aria-pressed="true">${wizardIcon(r[0])} ${r[1]}</span>`).join('')}</div><p class="vary">You can select multiple roles during General Setup.</p>`,['wizard','general','Edit Roles']);
const d=panel('<span class="ico">♛</span> Awards &amp; Achievements',`<div class="badge-tiles">${[['♛','Founder'],['✓','Verified'],['★','Contribution'],['◈','Milestones']].map(([symbol,name])=>`<div class="badge-tile"><span class="symbol">${symbol}</span><span>${name}</span></div>`).join('')}</div><p class="vary">Awards stay with About Me instead of using another profile tab.</p>`,['demo','Awards','View All']);
return `<div class="layout-columns tab-page"><div class="stack">${a}${b}</div><div class="stack">${c}${d}</div></div>`;
}
function songList(){const opts=[['my','My Songs'],['favorite','Favorites'],['want','Want to Sing'],['duet','Duets']];return `<div class="pill-filters">${opts.map(([key,label])=>`<button class="pill-filter" data-songfilter="${key}" aria-pressed="${songFilter===key}">${label}</button>`).join('')}</div><div class="feature-list">${data.songs.filter(s=>songFilter==='my'||s.type===songFilter).map(s=>feature('♫',s.title,s.artist,'song','Edit')).join('')||'<p class="note">No songs in this list.</p>'}</div>`;}
function karaoke(){const a=panel('<span class="ico">♫</span> Favorite Music &amp; Eras',`<div class="tags">${tags()}</div>`,['edit','genres']);const b=panel('<span class="ico">'+wizardIcon('singer')+'</span> My Karaoke Experience',`<p class="panel-copy">${esc(data.level)}</p><p class="vary">A guided choice from the four approved karaoke experience styles.</p>`,['wizard','singer','Change']);const c=panel('<span class="ico">⌂</span> Favorite Venues',`<div class="feature-list">${data.venues.map(v=>feature('⌂',v,'Favorite venue')).join('')}</div>`,['edit','venues','Add Venue']);const d=panel('<span class="ico">♬</span> My Karaoke Songs',songList(),['edit','song','Add Song']);const w=`<div class="wizard-list">${wizardList.filter(x=>x[0]==='singer').map(([key,name,desc])=>`<div class="wizard-row">${wizardBadge('singer')}<div class="wizard-text"><strong>${name}</strong><small>${desc}</small></div><button class="wizard-go" data-wizard="singer">Run Wizard ❯</button></div>`).join('')}</div>`;return `<div class="layout-columns tab-page"><div class="stack">${a}${b}${c}</div><div class="stack">${d}${panel('<span class="ico">'+wizardIcon('singer')+'</span> Singer Setup',w)}</div></div>`;}
function host(){return `<div class="layout-columns tab-page"><div class="stack">${panel('<span class="ico">'+wizardIcon('kj')+'</span> KJ / Host Profile',field('KJ Business',data.hostBusiness||'Not yet provided')+field('Host Status','Draft'),['wizard','kj','Set Up Host'])}${panel('<span class="ico">♧</span> Hosting Team',feature('♙','Primary Host',data.name)+`<p class="vary">Add co-hosts through the guided host setup.</p>`,['wizard','kj','Manage'])}</div><div class="stack">${panel('<span class="ico">▦</span> Hosting Schedule',`<div class="inline-note">No hosting schedule in this preview. Add venues and nights for admin review before they appear publicly.</div>`,['wizard','kj','Add Schedule'])}${panel('<span class="ico">⌂</span> Where I Host',field('Hosting Venue',data.hostLocation||'Not specified')+`<p class="vary">Venue schedules are linked to each host and require approval.</p>`,['wizard','kj','Manage Venues'])}</div></div>`;}
function venue(){return `<div class="layout-columns tab-page"><div class="stack">${panel('<span class="ico">'+wizardIcon('venue')+'</span> Venue Staff Profile',`<div class="inline-note">Selecting Venue Staff does not grant ownership or management permissions. Venue claims must be reviewed and approved.</div>`,['wizard','venue','Request Access'])}${panel('<span class="ico">▣</span> My Venues',field('Venue',data.venueBusiness||'None assigned')+field('Claim Status',data.venueStatus),['wizard','venue','Find Venue'])}</div><div class="stack">${panel('<span class="ico">♧</span> Venue Details',field('Amenities','Manage after approval')+field('Music Genres','Manage after approval')+field('Schedule','Manage after approval'),['wizard','venue','Set Up Venue'])}${panel('<span class="ico">♢</span> Posting Preferences',`<p class="panel-copy">Approved venue managers can control community karaoke-time submissions.</p>`,['wizard','venue','Review'])}</div></div>`;}
const privacyLabels=[['directory','Member Directory','Allow your profile to appear in the member directory.'],['photo','Public Profile Photo','Share your selected profile photo.'],['location','Location','Show your city or area publicly.'],['songs','My Song Lists','Let other members see your karaoke songs.'],['reviews','My Reviews','Allow others to see reviews you have posted.'],['venues','Favorite Venues','Show the venues you like to visit.'],['hostSchedule','KJ Hosting Schedule','Show your approved hosting schedule.']];
function privacyRows(){return privacyLabels.filter(([key])=>key!=='hostSchedule'||data.roles.includes('kj')).map(([key,label,detail])=>`<div class="privacy-row"><div><strong>${label}</strong><small>${detail}</small></div><button type="button" class="privacy-btn" role="switch" aria-label="${label}" aria-checked="${!!data.privacy[key]}" data-privacy="${key}"></button></div>`).join('');}
function privacyPage(){return `<div class="layout-columns tab-page"><div class="stack">${panel('<span class="ico">'+wizardIcon('privacy')+'</span> Privacy &amp; Visibility',privacyRows())}</div><div class="stack">${panel('<span class="ico">ⓘ</span> Privacy Information',`<p class="panel-copy">Your account controls what appears in the member directory and on your public profile. These sample switches work on the preview only.</p><div class="wizard-list">${`<div class="wizard-row">${wizardBadge('privacy')}<div class="wizard-text"><strong>Privacy Wizard</strong><small>Step-by-step privacy setup and explanations.</small></div><button class="wizard-go" data-wizard="privacy">Run Wizard ❯</button></div>`}</div>`)}</div></div>`;}

function render(){const defs=tabDefs();if(!defs.find(t=>t[0]===active))active='overview';$('#tabs').innerHTML=defs.map(([key,label,ico])=>`<button type="button" class="tab ${active===key?'active':''}" role="tab" data-tab="${key}" aria-selected="${active===key}" tabindex="${active===key?'0':'-1'}"><span aria-hidden="true" class="tab-ico">${tabIcon(key)}</span>${label}</button>`).join('');$('#tabContent').innerHTML=views[active]();$('#tabContent').setAttribute('aria-label',defs.find(t=>t[0]===active)[1]);updateHeader();}
function showDialog(title,body){wizard=null;returnFocus=document.activeElement;const dialog=$('#modalDialog');dialog.classList.remove('large');$('#modalHeading').textContent=title;$('#modalProgress').innerHTML='';$('#modalContent').innerHTML=body;$('#modalBack').hidden=true;$('#modalNext').hidden=true;$('#modalCancel').textContent='Close';$('#modalOverlay').hidden=false;$('#modalCancel').focus();}
function closeDialog(){$('#modalOverlay').hidden=true;wizard=null;render();returnFocus?.focus?.();}
/* Preview-only copy of the site's approved three portrait choices. */
const PROFILE_AVATAR_CHOICES=[
 ['mic','Microphone','assets/a2k-avatar-microphone-theatrical.png'],
 ['male','Male figure','assets/a2k-avatar-male-theatrical.png'],
 ['female','Female figure','assets/a2k-avatar-female-theatrical.png']
];
function profileAvatarPicker(){
 return '<div class="preview-avatar-options" role="group" aria-label="Default profile picture options">'+
 PROFILE_AVATAR_CHOICES.map(([key,label,url])=>'<button type="button" class="preview-avatar-option" data-avatar-choice="'+key+'" aria-pressed="'+(data.photo===url||(!data.photo&&key==='mic'))+'"><img src="'+url+'" alt=""><span>'+label+(key==='mic'?' · Default':'')+'</span></button>').join('')+
 '</div><div class="preview-avatar-actions"><button type="button" class="action-btn" data-avatar-upload>Upload My Own Photo</button><span id="previewAvatarStatus" role="status">Choose a portrait or upload your own.</span></div><p class="preview-avatar-note">Changes affect only this design preview. No member account or database is updated.</p>';
}
function editor(type){if(type==='profile'){showDialog('Edit Profile — Preview',`<div class="modal-form"><label>Display Name<input id="editName" type="text" value="${esc(data.name)}" maxlength="60"></label><label>Location<input type="text" id="editLocation" value="${esc(data.location)}"></label><p>Changes update this HTML preview only.</p><button class="action-btn" type="button" data-save="profile">Apply to Preview</button></div>`);}
 else if(type==='bio')showDialog('Edit About Me — Preview',`<div class="modal-form"><label>About Me<textarea id="editBio">${esc(data.bio)}</textarea></label><button class="action-btn" data-save="bio">Apply to Preview</button></div>`);

let generalDraft=null,generalDialog=null,generalOrigin=null,generalStage=0;

function genInfo(label,value){
 return '<div class="gen-info"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong></div>';
}
function genPortraitLabel(photo){
 const matching=PROFILE_AVATAR_CHOICES.find(x=>x[2]===photo);
 return !photo?'Microphone (default)':matching?matching[1]:'Custom photo';
}
function genPhotoChoices(){
 return '<div class="gen-tile-grid" role="group" aria-label="Choose a profile portrait">'+
 PROFILE_AVATAR_CHOICES.map(([id,label,source])=>'<button type="button" class="gen-tile" data-gen-photo="'+esc(id)+'" aria-pressed="'+String(id==='mic'?!generalDraft.photo||generalDraft.photo===source:generalDraft.photo===source)+'"><img src="'+esc(source)+'" alt=""><span>'+esc(label)+(id==='mic'?' · Default':'')+'</span></button>').join('')+
 '</div><div class="gen-portrait-upload"><button type="button" data-gen-upload>Upload My Own Photo</button><small id="genPhotoSelected">'+esc(genPortraitLabel(generalDraft.photo))+' selected</small></div>'+
 '<input type="file" id="gen-photo-input" accept="image/png,image/jpeg,image/webp" hidden aria-label="Upload your own profile photo">';
}
function genFlag(label,description,key,enabled){
 return '<button type="button" class="gen-tile gen-switch-tile" data-gen-privacy="'+key+'" aria-pressed="'+String(enabled)+'"><b>'+esc(label)+'</b><small>'+esc(description)+'</small><span>'+ (enabled?'Visible / On':'Private / Off') +'</span></button>';
}
function generalContent(){
 const d=generalDraft,step=generalStage;
 if(step===0){
  return '<h2 class="a2k-deletion-section-title">Profile Basics</h2>'+
   '<p class="gen-subtext">Introduce yourself to the karaoke community. You can update these details later.</p>'+
   '<section class="a2k-deletion-stage-box gen-card">'+
   '<label class="gen-field">Display Name<input id="gen-name" maxlength="60" autocomplete="off" value="'+esc(d.name)+'" aria-required="true" placeholder="Your display name"></label>'+
   '<label class="gen-field">About Me (optional)<textarea id="gen-bio" maxlength="1200" placeholder="Tell the karaoke community a little about yourself">'+esc(d.bio)+'</textarea></label>'+
   '<label class="gen-field">City, State or ZIP (optional)<input id="gen-location" maxlength="100" autocomplete="off" value="'+esc(d.location)+'" placeholder="e.g. Des Moines, IA"></label>'+
   '</section>';
 }
 if(step===1){
  return '<h2 class="a2k-deletion-section-title">Choose Your Profile Picture</h2>'+
   '<p class="gen-subtext">Select an A2K portrait or upload a photo of your own.</p>'+
   '<section class="a2k-deletion-stage-box gen-card">'+genPhotoChoices()+
   '<p class="gen-help">The microphone is the default. You can change your picture whenever you like.</p></section>';
 }
 if(step===2){
  return '<h2 class="a2k-deletion-section-title">My Karaoke Interests</h2>'+
   '<p class="gen-subtext">How are you part of the karaoke community? Choose any that apply.</p>'+
   '<section class="a2k-deletion-stage-box gen-card">'+
   '<div class="gen-interest-grid" role="group" aria-label="Select one or more karaoke interests">'+
   roles.map(([key,label])=>{
     const descriptions={singer:'I love singing karaoke, collecting songs, and discovering venues.',kj:'I host karaoke events, manage my nights, or perform as a KJ.',venue:'I work at or manage a venue that hosts karaoke.'};
     return '<button type="button" class="gen-interest-tile" data-gen-role="'+key+'" aria-pressed="'+String(d.roles.includes(key))+'"><span class="gen-interest-art" aria-hidden="true">'+wizardIcon(key)+'</span><strong>'+esc(label)+'</strong><small>'+esc(descriptions[key]||'')+'</small></button>';
   }).join('')+
   '</div><p class="gen-help">Select multiple interests if you like. These choices do not automatically grant verified badges, venue ownership, or management permissions.</p></section>';
 }
 return '<h2 class="a2k-deletion-section-title">Confirmation &amp; Submit</h2>'+
   '<p class="gen-subtext">Review your selections, then submit this design preview.</p>'+
   '<section class="a2k-deletion-stage-box gen-card"><h3>Your Profile</h3><div class="gen-summary">'+
   genInfo('Display Name',d.name||'Not entered')+
   genInfo('About Me',d.bio?.trim()?'Provided':'Not provided')+
   genInfo('Location',d.location||'Not provided')+
   genInfo('Profile Picture',genPortraitLabel(d.photo))+
   genInfo('Karaoke Interests',d.roles.map(x=>roles.find(r=>r[0]===x)?.[1]||x).join(', ')||'None selected')+
   '</div></section><p class="gen-note">Privacy and member-directory visibility are managed separately in the Privacy Wizard. Submit updates this preview only, not a real A2K account.</p>';
}
function renderGeneralStage(){
 if(!generalDialog||!generalDraft)return;
 const stage=generalDialog.querySelector('#a2k-deletion-stage');
 stage.classList.toggle('gen-profile-basics-step',generalStage===0);
 stage.innerHTML=generalContent();
 stage.scrollTop=0;
 generalDialog.querySelector('#gen-wizard-error').textContent='';
 generalDialog.querySelector('#gen-progress-label').textContent='Step '+(generalStage+1)+' of '+GENERAL_WIZARD_STEPS.length;
 generalDialog.querySelector('#gen-step-title').textContent=GENERAL_WIZARD_STEPS[generalStage];
 generalDialog.querySelector('#gen-back').hidden=generalStage===0;
 generalDialog.querySelector('#gen-next').textContent=generalStage===GENERAL_WIZARD_STEPS.length-1?'Submit':'Continue';
 generalDialog.querySelectorAll('.a2k-deletion-timeline-item').forEach(node=>{
  const idx=Number(node.dataset.step);
  node.classList.toggle('current',idx===generalStage);
  node.classList.toggle('completed',idx<generalStage);
  if(idx===generalStage)node.setAttribute('aria-current','step');else node.removeAttribute('aria-current');
 });
 generalDialog.querySelectorAll('.a2k-deletion-progress-dot').forEach(node=>node.classList.toggle('current',Number(node.dataset.step)===generalStage));
}
function generalAlert(message){
 const el=generalDialog?.querySelector('#gen-wizard-error');
 if(el)el.textContent=message;
}
function closeGeneralWizard(save){
 if(!generalDialog)return;
 if(save){
  data.name=generalDraft.name.trim();
  data.bio=generalDraft.bio.trim();
  data.location=generalDraft.location.trim();
  data.photo=generalDraft.photo;
  data.roles=[...generalDraft.roles];
 }
 const dialog=generalDialog,backTo=generalOrigin;
 generalDialog=null;generalDraft=null;generalOrigin=null;generalStage=0;
 if(dialog.open)dialog.close();
 dialog.remove();
 if(save){
  render();
  let notice=document.getElementById('gen-preview-saved-toast');
  if(!notice){
   notice=document.createElement('div');
   notice.id='gen-preview-saved-toast';
   notice.setAttribute('role','status');
   notice.style.cssText='position:fixed;z-index:2147483647;right:16px;bottom:18px;max-width:calc(100vw - 32px);padding:12px 18px;border:1px solid #d9a95c;border-radius:9px;background:#471016;color:#ffe9bf;box-shadow:0 4px 22px #0009;font:700 13px/1.45 Georgia,serif';
   document.body.append(notice);
  }
  notice.textContent='General Setup preview updated — no A2K account or database changes.';
  window.setTimeout(()=>{if(notice.isConnected)notice.remove();},7000);
 }
 if(backTo&&backTo.isConnected)backTo.focus();
}
function generalContinue(){
 if(!generalDraft)return;
 if(generalStage===0){
  generalDraft.name=generalDialog.querySelector('#gen-name')?.value||'';
  generalDraft.bio=generalDialog.querySelector('#gen-bio')?.value||'';
  generalDraft.location=generalDialog.querySelector('#gen-location')?.value||'';
  if(!generalDraft.name.trim()){
   generalAlert('Please enter a display name before continuing.');
   generalDialog.querySelector('#gen-name')?.focus();return;
  }
 }
 if(generalStage<GENERAL_WIZARD_STEPS.length-1){generalStage++;renderGeneralStage();return}
 if(!generalDraft.name.trim()){generalAlert('Display name is required.');return}
 closeGeneralWizard(true);
}
function openGeneralSetup(){
 if(generalDialog)return;
 generalOrigin=document.activeElement;
 generalDraft={
  name:data.name,bio:data.bio,location:data.location,photo:data.photo,
  roles:[...data.roles]
 };
 generalStage=0;
 const dialog=document.createElement('dialog');
 dialog.id='a2k-delete-account-dialog';
 dialog.className='a2k-deletion-wizard a2k-general-setup-preview';
 dialog.setAttribute('aria-labelledby','gen-dialog-title');
 dialog.style.setProperty('--a2k-deletion-curtain-image','url("'+GENERAL_ART_LOGO+'")');
 dialog.innerHTML=
 '<header class="a2k-deletion-titlebar"><div class="a2k-deletion-app-title"><strong class="a2k-deletion-app-brand" id="gen-dialog-title">Addicted to Karaoke</strong><span class="a2k-deletion-app-subtitle">GENERAL SETUP WIZARD</span></div></header>'+
 '<div class="a2k-deletion-layout"><aside class="a2k-deletion-sidebar">'+
 '<div class="a2k-deletion-art-frame a2k-deletion-logo-frame"><img class="a2k-deletion-brand" alt="Addicted to Karaoke vintage stage artwork" src="'+GENERAL_ART_LOGO+'"></div>'+
 '<h2 class="a2k-deletion-side-title">General Setup Wizard</h2>'+
 '<div class="a2k-deletion-timeline">'+GENERAL_WIZARD_STEPS.map((label,i)=>'<div class="a2k-deletion-timeline-item" data-step="'+i+'"><span class="a2k-deletion-timeline-dot"></span><strong>'+esc(label)+'</strong></div>').join('')+'</div>'+
 '<div class="a2k-deletion-art-frame a2k-deletion-crowd-frame"><img class="a2k-deletion-crowd" alt="" src="'+GENERAL_ART_CROWD+'"><span class="a2k-deletion-side-foot">PRIVATE &amp; SECURE</span></div></aside>'+
 '<section class="a2k-deletion-right"><div class="a2k-deletion-mobile-progress">'+GENERAL_WIZARD_STEPS.map((_,i)=>'<span class="a2k-deletion-progress-dot" data-step="'+i+'"></span>').join('')+'<span id="gen-step-title" class="a2k-deletion-progress-label"></span></div>'+
 '<div id="a2k-deletion-stage" class="a2k-deletion-stage"></div>'+
 '<p id="gen-wizard-error" class="gen-wizard-error" role="alert"></p>'+
 '</section></div>'+
 '<footer class="a2k-deletion-footer"><div class="a2k-deletion-footer-progress"><strong class="a2k-deletion-footer-label" id="gen-progress-label">Step 1 of 4</strong><small class="a2k-deletion-footer-build">Profile Preview V29</small></div>'+
 '<div class="a2k-deletion-footer-actions"><button type="button" class="a2k-deletion-btn a2k-deletion-btn-subtle" id="gen-cancel">Cancel</button>'+
 '<button type="button" class="a2k-deletion-btn a2k-deletion-btn-subtle" id="gen-back" hidden>Previous</button>'+
 '<button type="button" class="a2k-deletion-btn a2k-deletion-btn-primary" id="gen-next">Continue</button></div></footer>';
 generalDialog=dialog;
 dialog.addEventListener('cancel',e=>{e.preventDefault();closeGeneralWizard(false)});
 dialog.addEventListener('click',ev=>{
  const e=ev.target;
  if(e.closest('#gen-cancel')){closeGeneralWizard(false);return}
  if(e.closest('#gen-back')){if(generalStage>0){generalStage--;renderGeneralStage()}return}
  if(e.closest('#gen-next')){generalContinue();return}
  const photo=e.closest('[data-gen-photo]');
  if(photo){
   const choice=PROFILE_AVATAR_CHOICES.find(x=>x[0]===photo.dataset.genPhoto);
   if(choice){generalDraft.photo=choice[0]==='mic'?null:choice[2];renderGeneralStage()}
   return;
  }
  if(e.closest('[data-gen-upload]')){dialog.querySelector('#gen-photo-input')?.click();return}
  const role=e.closest('[data-gen-role]');
  if(role){
   const key=role.dataset.genRole;
   if(generalDraft.roles.includes(key))generalDraft.roles=generalDraft.roles.filter(x=>x!==key);
   else generalDraft.roles.push(key);
   renderGeneralStage();
  }
 });
 dialog.addEventListener('input',ev=>{
  if(ev.target.id==='gen-name')generalDraft.name=ev.target.value;
  if(ev.target.id==='gen-bio')generalDraft.bio=ev.target.value;
  if(ev.target.id==='gen-location')generalDraft.location=ev.target.value;
 });
 dialog.addEventListener('change',ev=>{
  if(ev.target.id!=='gen-photo-input')return;
  const file=ev.target.files?.[0];
  if(!file)return;
  if(!/^image\/(png|jpeg|webp)$/.test(file.type)){generalAlert('Choose a JPG, PNG, or WebP picture.');return}
  if(file.size>5*1024*1024){generalAlert('Please select an image smaller than 5 MB for this preview.');return}
  const reader=new FileReader();
  reader.onload=()=>{if(generalDialog===dialog&&generalDraft){generalDraft.photo=reader.result;renderGeneralStage()}};
  reader.onerror=()=>generalAlert('Unable to read this picture. Please try another file.');
  reader.readAsDataURL(file);
 });
 document.body.append(dialog);
 dialog.showModal();
 renderGeneralStage();
}

function openWizard(type){if(type==='general'){openGeneralSetup();return;}returnFocus=document.activeElement;wizard={type,index:0};$('#modalDialog').classList.add('large');$('#modalHeading').textContent=wizardNames[type];$('#modalOverlay').hidden=false;drawWizard();}
function selectChoice(id,value){if(id==='role')data.roles.includes(value)?data.roles=data.roles.filter(x=>x!==value):data.roles.push(value);if(id==='level')data.level=value;if(id==='genre')data.genres.includes(value)?data.genres=data.genres.filter(x=>x!==value):data.genres.push(value);}
function choices(items,which,current,multiple){return `<div class="modal-choices">${items.map(x=>`<button type="button" class="choice" data-choice="${which}" data-value="${esc(x)}" aria-pressed="${multiple?current.includes(x):current===x}">${esc(x)}</button>`).join('')}</div>`;}
function wizardPage(type,index){
 const pick=wizardSteps[type][index];let inner=`<h3>${pick}</h3>`;
 if(type==='general'){
  if(index===0)inner+=`<p>Get the essentials ready so other A2K members can recognize you.</p><div class="modal-form"><label>Display Name<input id="wizName" type="text" value="${esc(data.name)}"></label><label>About Me (optional)<textarea id="wizBio">${esc(data.bio)}</textarea></label></div>`;
  if(index===1)inner+=`<p>Add a location and an optional profile photo. The existing picture stays selected unless changed.</p><div class="modal-form"><label>City or ZIP<input id="wizLocation" type="text" value="${esc(data.location)}"></label>${profileAvatarPicker()}</div>`;
  if(index===2)inner+=`<p>Choose one or more roles. Relevant profile tabs appear automatically.</p>${choices(roles.map(x=>x[1]),'role',data.roles.map(k=>roles.find(r=>r[0]===k)?.[1]),true)}`;
 }
 if(type==='singer'){
  if(index===0)inner+=`<p>How would you describe your karaoke experience?</p>${choices(['Just Getting Started','Casual Singer','Karaoke Regular','Karaoke Veteran'],'level',data.level,false)}`;
  if(index===1)inner+=`<p>Choose as many favorite music styles and eras as you like.</p>${choices(['Rock','Pop','Country','80s','90s','2000s','Classic Rock','Oldies','R&B','Singalongs'],'genre',data.genres,true)}`;
  if(index===2)inner+=`<p>Add the songs you love or save them later in My Karaoke.</p><div class="modal-form"><label>Song title (optional)<input id="wizSong" type="text" placeholder="Your favorite song"></label><label>Artist (optional)<input id="wizArtist" type="text" placeholder="Artist"></label></div>`;
  if(index===3)inner+=`<p>Add a favorite venue or skip for later.</p><div class="modal-form"><label>Favorite venue (optional)<input id="wizVenue" type="text" placeholder="Venue name"></label></div>`;
 }
 if(type==='kj'){
  if(index===0)inner+=`<p>Tell the community about your hosting work.</p><div class="modal-form"><label>KJ / Business Name<input id="wizHostName" type="text" value="${esc(data.hostBusiness)}" placeholder="Stage or business name"></label></div>`;
  if(index===1)inner+=`<p>Co-hosts are optional. You can add verified hosting team members later.</p><div class="inline-note">This preview shows the hosting team step without modifying a real KJ profile.</div>`;
  if(index===2)inner+=`<p>Link a venue where you host. Submissions must be reviewed.</p><label>Hosting Venue<input id="wizHostVenue" type="text" value="${esc(data.hostLocation)}" placeholder="Venue name"></label>`;
  if(index===3)inner+=`<p>Schedules are associated with a KJ and a venue. Example schedule only.</p><div class="modal-form"><label>Day<select id="wizHostDay"><option>Friday</option><option>Saturday</option><option>Wednesday</option><option>Thursday</option></select></label><label>Start time<select><option>8:00 PM</option><option>9:00 PM</option><option>7:00 PM</option></select></label></div>`;
 }
 if(type==='venue'){
  if(index===0)inner+=`<p>Find or add a karaoke venue you represent.</p><label>Venue Name<input id="wizVenueBusiness" type="text" value="${esc(data.venueBusiness)}" placeholder="Venue or business name"></label>`;
  if(index===1)inner+=`<p>Claim requests require verification and administrator approval; choosing Venue Staff alone grants no permissions.</p><div class="inline-note">This is a design preview. No claim is sent or approved.</div>`;
  if(index===2)inner+=`<p>Approved staff will configure amenities, music genres, karaoke schedules, and posting preferences here.</p>${choices(['Food','Full Bar','Parking','Private Karaoke Rooms'],'feature',[],true)}`;
 }
 if(type==='privacy'){
  if(index===0)inner+=`<p>Control your profile and directory visibility.</p>${privacyLabels.slice(0,3).map(([key,label,desc])=>`<div class="privacy-row"><div><strong>${label}</strong><small>${desc}</small></div><button class="privacy-btn" type="button" role="switch" aria-label="${label}" data-privacy="${key}" aria-checked="${!!data.privacy[key]}"></button></div>`).join('')}`;
  if(index===1)inner+=`<p>Control which parts of your karaoke activity are visible.</p>${privacyLabels.slice(3).map(([key,label,desc])=>`<div class="privacy-row"><div><strong>${label}</strong><small>${desc}</small></div><button class="privacy-btn" type="button" role="switch" aria-label="${label}" data-privacy="${key}" aria-checked="${!!data.privacy[key]}"></button></div>`).join('')}`;
  if(index===2)inner+=`<p>Review your selections. Changes in this prototype affect only its visual state, not your real account.</p><div class="inline-note">${Object.values(data.privacy).filter(Boolean).length} of ${Object.keys(data.privacy).length} example privacy settings are enabled.</div>`;
 }
 return inner;
}
function captureWizard(){if(!wizard)return;const {type,index}=wizard;const val=id=>document.getElementById(id)?.value?.trim()||'';
 if(type==='general'){if(index===0){data.name=val('wizName')||data.name;data.bio=val('wizBio')||data.bio}if(index===1)data.location=val('wizLocation')||data.location;}
 if(type==='singer'){if(index===2&&val('wizSong'))data.songs.push({title:val('wizSong'),artist:val('wizArtist')||'Unknown',type:'my'});if(index===3&&val('wizVenue')&&!data.venues.includes(val('wizVenue')))data.venues.push(val('wizVenue'));}
 if(type==='kj'){if(index===0)data.hostBusiness=val('wizHostName');if(index===2)data.hostLocation=val('wizHostVenue');}
 if(type==='venue'&&index===0)data.venueBusiness=val('wizVenueBusiness');
}
function drawWizard(){if(!wizard)return;const {type,index}=wizard,steps=wizardSteps[type];$('#modalProgress').innerHTML=`${wizardBadge(type)}<h3>${wizardNames[type]}</h3>${steps.map((s,i)=>`<div class="step-marker ${i===index?'current':''}"><b>${i+1}</b>${esc(s)}</div>`).join('')}`;$('#modalContent').innerHTML=wizardPage(type,index);$('#modalBack').hidden=false;$('#modalBack').disabled=index===0;$('#modalNext').hidden=false;$('#modalNext').textContent=index===steps.length-1?'Finish Preview':'Next';$('#modalCancel').textContent='Close';$('#modalContent').scrollTop=0;}
function wizardNext(){if(!wizard)return;captureWizard();if(wizard.index<wizardSteps[wizard.type].length-1){wizard.index++;drawWizard()}else{showDialog('Setup Preview Complete',`<h3>You've reached the end!</h3><p>Your test selections are reflected in this HTML preview. They have not been saved to any A2K account.</p><p>Close this window to review the updated profile sections.</p>`);render();}}
function saveEditor(type){if(type==='profile'){data.name=$('#editName')?.value.trim()||data.name;data.location=$('#editLocation')?.value.trim()||data.location;closeDialog()}
 else if(type==='bio'){data.bio=$('#editBio')?.value.trim()||data.bio;closeDialog()}
 else if(type==='genres')closeDialog();
 else if(type==='venue'){const v=$('#newVenue')?.value.trim();if(v&&!data.venues.includes(v))data.venues.push(v);closeDialog()}
 else if(type==='song'){const title=$('#newSong')?.value.trim();if(title)data.songs.push({title,artist:$('#newArtist')?.value.trim()||'Unknown',type:'my'});closeDialog()}
 else if(type==='photo'){const f=$('#newPhoto')?.files?.[0];if(f&&f.type.startsWith('image/')){const reader=new FileReader();reader.onload=()=>{data.photo=reader.result;closeDialog()};reader.readAsDataURL(f)}else closeDialog()}
}
document.addEventListener('click',e=>{
 const avatarSelect=e.target.closest('[data-avatar-choice]');
 if(avatarSelect){
  const selected=PROFILE_AVATAR_CHOICES.find(([key])=>key===avatarSelect.dataset.avatarChoice);
  if(selected){data.photo=selected[2];updateHeader();document.querySelectorAll('[data-avatar-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.avatarChoice===selected[0])));const status=$('#previewAvatarStatus');if(status)status.textContent=selected[1]+' selected for preview.';}
  return;
 }
 const avatarUpload=e.target.closest('[data-avatar-upload]');if(avatarUpload){$('#avatarFilePicker').click();return}
 const avatarButton=e.target.closest('[data-photo-picker]');if(avatarButton){editor('photo');return}
 const editButton=e.target.closest('[data-edit]');if(editButton){editor(editButton.dataset.edit);return}
 const x=e.target.closest('[data-tab]');if(x){active=x.dataset.tab;render();return}
 const role=e.target.closest('[data-role]');if(role){const key=role.dataset.role;data.roles.includes(key)?data.roles=data.roles.filter(r=>r!==key):data.roles.push(key);render();return}
 const wizardButton=e.target.closest('[data-wizard]');if(wizardButton){openWizard(wizardButton.dataset.wizard);return}
 const action=e.target.closest('[data-action]');if(action){const id=action.dataset.action,key=action.dataset.target;if(id==='edit'){editor(key);return}if(id==='wizard'){openWizard(key);return}if(id==='genre'){editor('genres');return}if(id==='stat'){if(key==='My Songs'||key==='Favorites'){active='karaoke';songFilter=key==='Favorites'?'favorite':'my';render()}else showDialog('Activity Preview',`<p>Here is where your ${esc(key)} would appear on the real profile.</p>`);return}if(id==='demo'||id==='song'){showDialog('Preview Only',`<p>This is a design example. The ${esc(key||'selected')} function will be connected after you approve the layout.</p>`);return}}
 const f=e.target.closest('[data-songfilter]');if(f){songFilter=f.dataset.songfilter;render();return}
 const p=e.target.closest('[data-privacy]');if(p){const key=p.dataset.privacy;data.privacy[key]=!data.privacy[key];if(wizard){drawWizard()}else render();return}
 const choice=e.target.closest('[data-choice]');if(choice){const type=choice.dataset.choice,key=choice.dataset.value;if(type==='role'){const r=roles.find(r=>r[1]===key);if(r)selectChoice('role',r[0])}else if(type==='genre'||type==='level')selectChoice(type,key);else{choice.setAttribute('aria-pressed',String(choice.getAttribute('aria-pressed')!=='true'));return}if(wizard)drawWizard();else editor('genres');return}
 const save=e.target.closest('[data-save]');if(save){saveEditor(save.dataset.save);return}
 const nav=e.target.closest('[data-nav]');if(nav){if(nav.dataset.nav==='Profile')active='overview';else showDialog('This is the Profile Test Page',`<p>The ${esc(nav.dataset.nav)} menu is part of the existing A2K website. This prototype only changes the Profile area.</p>`);render();return}
 if(e.target.closest('#resetDemo')){data=structuredClone(defaultData);active='overview';songFilter='my';render();return}
 if(e.target.closest('#modalCancel')){closeDialog();return}
 if(e.target.closest('#modalBack')){if(wizard&&wizard.index>0){captureWizard();wizard.index--;drawWizard()}return}
 if(e.target.closest('#modalNext')){wizardNext();return}
 if(e.target===$('#modalOverlay'))closeDialog();
});
document.addEventListener('change',e=>{if(e.target.id!=='avatarFilePicker')return;const f=e.target.files?.[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)){showDialog('Choose a Photo',`<p>Please choose a JPG, PNG, or WebP picture.</p>`);e.target.value='';return}const reader=new FileReader();reader.onload=()=>{data.photo=reader.result;updateHeader();document.querySelectorAll('[data-avatar-choice]').forEach(b=>b.setAttribute('aria-pressed','false'));const status=$('#previewAvatarStatus');if(status)status.textContent='Your own photo selected for preview.';};reader.readAsDataURL(f);e.target.value='';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modalOverlay').hidden){closeDialog();return}if(e.target.closest('.tabs')&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){const defs=tabDefs().map(x=>x[0]);let n=defs.indexOf(active);if(e.key==='ArrowRight')n=(n+1)%defs.length;if(e.key==='ArrowLeft')n=(n-1+defs.length)%defs.length;if(e.key==='Home')n=0;if(e.key==='End')n=defs.length-1;active=defs[n];render();$('#tabs').querySelector(`[data-tab="${active}"]`)?.focus();e.preventDefault();}});
drawNav();render();
})();
</script></body></html>
