<svg xmlns="http://www.w3.org/2000/svg" width="220" height="150" viewBox="0 0 220 150" role="img" aria-labelledby="title">
<title id="title">Vintage gold microphone with spotlight rays</title>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".9">
  <stop offset="0" stop-color="#fff0ba"/><stop offset=".19" stop-color="#dbad5e"/>
  <stop offset=".42" stop-color="#a65d24"/><stop offset=".63" stop-color="#f4ce81"/>
  <stop offset="1" stop-color="#9c551f"/>
 </linearGradient>
 <linearGradient id="shadow" x1="0" y1="0" x2=".85" y2="1">
  <stop offset="0" stop-color="#713014"/><stop offset=".5" stop-color="#2b100b"/>
  <stop offset="1" stop-color="#8c431e"/>
 </linearGradient>
 <linearGradient id="grille" x1="0" x2="1">
  <stop offset="0" stop-color="#a15e26"/><stop offset=".24" stop-color="#ffdf9b"/>
  <stop offset=".55" stop-color="#b97938"/><stop offset=".85" stop-color="#f9cf7d"/><stop offset="1" stop-color="#8e4619"/>
 </linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="2"/>
 </filter>
 <filter id="shadowfilter" x="-40%" y="-40%" width="180%" height="200%">
  <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000" flood-opacity=".8"/>
 </filter>
 <clipPath id="head"><path d="M-18 -29 C-18 -47 -11 -53 0 -53 C11 -53 18 -47 18 -29 L18 -13 Q18 -1 0 2 Q-18 -1 -18 -13 Z"/></clipPath>
</defs>
<!-- delicate copper spotlight lines -->
<g transform="translate(110 67)" stroke="#c48a43" stroke-linecap="round">
 <g opacity=".45" stroke-width=".8">
  <path d="M0 -64V-56 M0 57V64 M-76 0H-67 M67 0H76"/>
  <path d="M-58 -51L-52 -45 M52 45L58 51 M58 -51L52 -45 M-52 45L-58 51"/>
 </g>
 <g opacity=".82" stroke-width="1.6">
  <path d="M0 -59V-46 M0 45V59 M-71 0H-58 M58 0H71"/>
  <path d="M-51 -48L-41 -38 M41 38L51 48 M51 -48L41 -38 M-41 38L-51 48"/>
  <path d="M-28 -61L-22 -48 M22 -48L28 -61 M-62 -27L-49 -22 M49 -22L62 -27"/>
  <path d="M-62 27L-49 22 M49 22L62 27 M-28 61L-22 48 M22 48L28 61"/>
 </g>
</g>
<!-- slight gold halo -->
<ellipse cx="110" cy="64" rx="30" ry="38" fill="#bf7534" opacity=".18" filter="url(#glow)"/>
<!-- angled classic microphone, including slotted grille -->
<g transform="translate(111 68) rotate(-17)" filter="url(#shadowfilter)">
 <path d="M-18 -30 Q-19 -53 0 -54 Q19 -53 18 -30 L18 -13 Q17 3 0 5 Q-17 3 -18 -13 Z" fill="url(#grille)" stroke="#ffdf8e" stroke-width="1.9"/>
 <g clip-path="url(#head)">
  <path d="M-22 -42H22 M-22 -35H22 M-22 -28H22 M-22 -21H22 M-22 -14H22 M-22 -7H22" fill="none" stroke="#2e160c" stroke-width="3.3" opacity=".9"/>
  <path d="M-22 -44H22 M-22 -37H22 M-22 -30H22 M-22 -23H22 M-22 -16H22 M-22 -9H22" fill="none" stroke="#fff0b8" stroke-width="1.4" opacity=".8"/>
  <path d="M-13 -51Q-17 -22 -12 -3 M-4 -52Q-7 -22 -4 0 M5 -52Q8 -22 5 0 M13 -51Q17 -22 12 -4" fill="none" stroke="#8f4d21" stroke-width="1.6"/>
  <path d="M-10 -52Q-14 -26 -9 -4 M0 -54V1 M10 -52Q14 -26 9 -4" fill="none" stroke="#fff1b2" stroke-width=".6" opacity=".65"/>
 </g>
 <path d="M-23 -17Q-23 10 0 13 Q23 10 23 -17" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
 <path d="M-10 10V17Q-10 24 0 24 Q10 24 10 17V10" fill="none" stroke="#bf8b4e" stroke-width="3"/>
 <path d="M-5 22L-5 52 Q-4 58 0 58 Q4 58 5 52L5 22" fill="url(#gold)" stroke="#4d2211" stroke-width="1.5"/>
 <path d="M-7 58H7" stroke="#f9d491" stroke-width="3" stroke-linecap="round"/>
 <path d="M-3 29H3 M-3 34H3 M-3 39H3" stroke="#7e491f" stroke-width="1.8"/>
</g>
<path d="M100 132 C121 143 148 134 158 122" fill="none" stroke="#c68747" stroke-width="1.5" opacity=".62"/>
</svg>